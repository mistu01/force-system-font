plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mk982.forcesystemfont'
    compileSdk 34

    defaultConfig {
        applicationId "com.mk982.forcesystemfont"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://api.xposed.info/' }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
