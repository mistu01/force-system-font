name: Build APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  release:
    types: [ published, created ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

      - name: Extract Version Info
        id: versioning
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | awk -F'"' '{print $2}')
          if [ -z "$VERSION" ]; then
            VERSION="1.1"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=Force System Font $TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign and Align APK
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          
          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "Error: Release APK was not found at $UNSIGNED_APK"
            exit 1
          fi

          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" aligned.apk

          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "Signing with repository production keystore..."
            echo "$KEYSTORE_B64" | base64 --decode > my.keystore
            $BUILD_TOOLS_DIR/apksigner sign --ks my.keystore --ks-pass env:KEYSTORE_PASS --ks-key-alias "$ALIAS" --key-pass env:KEY_PASS --out ForceSystemFont.apk aligned.apk
          else
            echo "Warning: Repository signing secrets not detected. Signing with test keystore for installable output..."
            keytool -genkey -v -keystore test.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android,O=Android,C=US"
            $BUILD_TOOLS_DIR/apksigner sign --ks test.keystore --ks-pass pass:android --ks-key-alias android --key-pass pass:android --out ForceSystemFont.apk aligned.apk
          fi

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForceSystemFont-${{ steps.versioning.outputs.tag }}
          path: ForceSystemFont.apk
          if-no-files-found: error

      - name: Ensure Tag Exists for Release
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="${{ steps.versioning.outputs.tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Creating and pushing git tag $TAG..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG" || echo "Tag may already exist on remote"
          fi

      - name: Publish to GitHub Release
        if: github.event_name == 'release' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: ${{ steps.versioning.outputs.title }}
          files: ForceSystemFont.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
